<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Produit</title>

<style>
body {
  font-family: Arial;
  background: #f5f5f5;
  margin: 0;
  padding: 15px;
}

/* CARD */
.card {
  background: white;
  border-radius: 12px;
  padding: 15px;
  margin-bottom: 15px;
}

/* IMAGE */
.product-img {
  width: 100%;
  max-height: 250px;         /* ✅ fixed size */
  object-fit: contain;       /* ✅ no stretch */
  display: block;
  margin: auto;
  border-radius: 10px;
}

/* TITLE */
h2 {
  margin: 10px 0 5px;
}

/* PRICE */
.price {
  color: #1e3a8a;
  font-weight: bold;
  font-size: 20px;
}

/* STOCK */
.stock {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 8px 0 10px;
}

.stock-badge {
  background: #d1fae5;
  color: green;
  padding: 4px 8px;
  border-radius: 6px;
  font-size: 12px;
}

.stock-text {
  font-size: 13px;
  color: #555;
}

/* DETAILS */
.details p {
  margin: 6px 0;
  font-size: 14px;
}

/* QUANTITY */
.qty {
  display: flex;
  align-items: center;
  gap: 10px;
}

.qty button {
  padding: 8px 12px;
  font-size: 16px;
}

.qty input {
  width: 50px;
  text-align: center;
}

/* WHATSAPP */
.whatsapp {
  display: block;
  width: 100%;
  text-align: center;
  background: #25D366;
  color: white;
  padding: 14px;
  border-radius: 8px;
  text-decoration: none;
  font-weight: bold;
  margin-top: 10px;
}
</style>
</head>

<body>

<!-- 🖼️ IMAGE CARD -->
<div class="card">
  <img id="img" class="product-img">
</div>

<!-- 📋 DETAILS CARD -->
<div class="card">

  <h2 id="name"></h2>
  <div class="price" id="price"></div>

  <div class="stock">
    <span class="stock-badge">En stock</span>
    <span class="stock-text">Disponible en magasin</span>
  </div>

  <div class="details" id="details"></div>

</div>

<!-- 🟢 ACTION CARD -->
<div class="card">

  <!-- ✅ QUANTITÉ LABEL ADDED -->
  <p style="margin-bottom:8px; font-weight:500;">Quantité</p>

  <div class="qty">
    <button onclick="minus()">-</button>
    <input id="qty" value="1">
    <button onclick="plus()">+</button>
  </div>

  <a id="whatsapp" target="_blank" class="whatsapp">
    Commander sur WhatsApp
  </a>

</div>

<script>

// GET DATA
const p = new URLSearchParams(window.location.search);

const name = p.get("name") || "Produit";
const price = p.get("price") || "0";
const img = p.get("img") || "";
const desc = p.get("desc") || "";

// 👉 NEW (IMPORTANT)
const cat = p.get("cat") || "ordinateur";
const brand = p.get("brand") || name.split(" ")[0];

// DISPLAY
document.getElementById("name").innerText = name;
document.getElementById("price").innerText = price + " FCFA";
document.getElementById("img").src = img;

// 🔥 DYNAMIC DETAILS
let detailsHTML = "";

// 🖥️ ORDINATEUR
if (cat === "ordinateur") {
  detailsHTML = `
  <p>🔧 <strong>Marque :</strong> ${brand}</p>
  <p>🖥️ <strong>Processeur :</strong> ${desc}</p>
  <p>💾 <strong>Mémoire RAM :</strong> 8 GB DDR4</p>
  <p>📦 <strong>Stockage :</strong> SSD</p>
  <p>📺 <strong>Écran :</strong> HD</p>
  <p>🛡️ <strong>Garantie :</strong> 6 mois</p>
  `;
}

// 🖨️ IMPRIMANTE
else if (cat === "imprimante") {
  detailsHTML = `
  <p>🔧 <strong>Marque :</strong> ${brand}</p>
  <p>🖨️ <strong>Fonctions :</strong> ${desc}</p>
  <p>📶 <strong>Connectivité :</strong> WiFi / USB</p>
  <p>🎨 <strong>Type :</strong> Couleur / Noir</p>
  <p>🛡️ <strong>Garantie :</strong> 6 mois</p>
  `;
}

// 🎧 ACCESSOIRE (FIXED ✅)
else if (cat === "accessoire") {
  detailsHTML = `
  <p>🔧 <strong>Marque :</strong> ${brand}</p>
  <p>⚙️ <strong>Type :</strong> ${name}</p>
  <p>📄 <strong>Description :</strong> ${desc}</p>
  <p>🛡️ <strong>Garantie :</strong> 3 mois</p>
  `;
}


else if (cat === "fourniture") {
  detailsHTML = `
  <p>🔧 <strong>Marque :</strong> ${brand}</p>
  <p>📦 <strong>Produit :</strong> ${name}</p>
  <p>📄 <strong>Description :</strong> ${desc}</p>
  <p>🛡️ <strong>Garantie :</strong> 1 mois</p>
  `;
}

else if (cat === "livre") {
  detailsHTML = `
  <p>📚 <strong>Type :</strong> ${name}</p>
  <p>🏷️ <strong>Éditeur :</strong> ${brand}</p>
  <p>📄 <strong>Description :</strong> ${desc}</p>
  <p>🛡️ <strong>Garantie :</strong> Aucun</p>
  `;
}

// APPLY DETAILS
document.getElementById("details").innerHTML = detailsHTML;


// QUANTITY
function plus() {
  let q = document.getElementById("qty");
  q.value++;
  update();
}

function minus() {
  let q = document.getElementById("qty");
  if (q.value > 1) q.value--;
  update();
}

// WHATSAPP
function update() {
  let qty = document.getElementById("qty").value;

  let msg = `Bonjour, je veux commander : 🛒

📦 Produit : ${name}
💰 Prix : ${price} FCFA
🔢 Quantité : ${qty}

🖼️ Image du produit :
${window.location.origin}/${img}

Merci.`;

  document.getElementById("whatsapp").href =
    "https://wa.me/23566322486?text=" + encodeURIComponent(msg);
}
update();

</script>

</body>
</html>
